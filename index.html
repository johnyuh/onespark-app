<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>泉田喻氏宗譜 數位化下載</title>
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: "DFKai-SB", "Noto Sans TC", sans-serif;
      background-color: #f8f9fa;
      color: #222;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 1.2rem;
    }
    h1 { margin: 0.3em 0; }
    main {
      max-width: 700px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }
    a.download-btn {
      display: block;
      margin: 1em auto;
      padding: 1em;
      width: 90%;
      max-width: 320px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, #007bff, #00bfff);
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      transition: all 0.2s;
    }
    a.download-btn:hover { transform: scale(1.05); }
    #progress {
      width: 80%;
      max-width: 360px;
      height: 10px;
      background: #ddd;
      margin: 2em auto;
      border-radius: 5px;
      display: none;
      overflow: hidden;
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: #28a745;
      transition: width 0.1s linear;
    }
    footer {
      margin-top: 2rem;
      color: #666;
      font-size: 0.9rem;
    }
    #donate-btn {
      position: fixed;
      left: 20px;
      bottom: 20px;
      background: linear-gradient(90deg, #ff758c, #ff7eb3);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 0.7em 1.3em;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      transition: transform 0.2s;
      z-index: 999;
    }
    #donate-btn:hover { transform: scale(1.08); }
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>泉田喻氏宗譜 數位化檔案</h1>
    <p>2025 整合版</p>
  </header>

  <main>
    <h2>📘 族譜電子版下載</h2>

    <p style="margin:10px 0 4px; font-weight:bold;">📥 直接下載宗譜電子版</p>

    <a class="download-btn" href="https://johnyuh.github.io/onespark-app/files/泉田喻氏宗譜_2025整合本_橫式版.pdf">下載 橫式版 PDF</a>
    <a class="download-btn" href="https://johnyuh.github.io/onespark-app/files/泉田喻氏宗譜_派代表樹狀圖_2025新版.pdf">下載 樹狀圖 PDF</a>
    <a class="download-btn" href="https://johnyuh.github.io/onespark-app/files/泉田喻氏宗譜_2025整合本_橫式版.docx">下載 橫式版 Word</a>

    <div id="progress"><div id="progress-bar"></div></div>
  </main>

  <footer>
    <p>製作：OS星火 ｜ 更新日期：2025/10/18</p>
  </footer>

  <button id="donate-btn" onclick="window.location.href='donate.html'">💖 贊助</button>
  <div id="toast">✅ 檔案已成功下載</div>

  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  }

  const progress = document.getElementById('progress');
  const progressBar = document.getElementById('progress-bar');
  const toast = document.getElementById('toast');

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  document.querySelectorAll('a.download-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      const url = btn.href;
      const fileName = decodeURIComponent(url.split('/').pop());

      progress.style.display = 'block';
      progressBar.style.width = '0%';

      let width = 0;
      const timer = setInterval(() => {
        width += 12;
        progressBar.style.width = width + '%';
        if (width >= 100) clearInterval(timer);
      }, 150);

      try {
        const res = await fetch(url);
        const blob = await res.blob();
        clearInterval(timer);
        progressBar.style.width = '100%';

        const file = new File([blob], fileName);
        const blobUrl = URL.createObjectURL(blob);

        // ✅ iOS18 / Safari / PWA 支援直接分享儲存
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: fileName,
            text: '下載 OneSpark 星火 檔案',
            files: [file]
          });
        } else {
          // 備援：其他瀏覽器直接觸發下載
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast(`✅ ${fileName} 已下載`);
        }

        setTimeout(() => {
          progress.style.display = 'none';
          showToast('✅ 下載完成');
        }, 600);

        setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
      } catch {
        alert("下載失敗，請稍後再試。");
        progress.style.display = 'none';
      }
    });
  });
  </script>
</body>
</html>
