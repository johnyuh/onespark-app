<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OneSpark 星火 ☕</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OneSpark 星火">
  <meta name="theme-color" content="#ff8800">
  <style>
    body {
      font-family: -apple-system, system-ui, "PingFang TC", "Noto Sans TC", sans-serif;
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#fff6e6; color:#3a2a22; flex-direction:column;
    }
    .card {
      text-align:center; padding:28px 22px; border-radius:16px;
      background:#ffffffcc; backdrop-filter: blur(6px);
      box-shadow: 0 8px 28px rgba(0,0,0,.12);
      width:min(92vw,520px); margin-bottom:60px;
    }
    h1 { margin:10px 0 6px; font-size:28px; }
    p { margin:0 0 18px; opacity:.8; }
    a.download-btn {
      font-size:18px; padding:12px 20px; border-radius:12px; border:0;
      background:#ff8800; color:#fff; cursor:pointer; text-decoration:none;
      display:inline-block; margin:6px 0;
    }
    a.download-btn:active { transform: scale(0.98); }
    .logo {
      width:92px; height:92px; border-radius:24px;
      background:#ff8800 url('icons/icon-192.png') center/80% no-repeat;
      margin:0 auto 8px;
    }
    .progress {
      width:80%; height:12px; border-radius:6px;
      background:rgba(0,0,0,0.1); margin:16px auto;
      overflow:hidden; display:none;
    }
    .progress-bar {
      width:0%; height:100%; background:#ff8800; transition:width 0.2s;
    }
    .complete {
      display:none; margin-top:8px; color:#3a2a22; font-size:14px; opacity:0;
      transition: opacity 0.6s;
    }
    footer {
      position:fixed; bottom:10px; width:100%; text-align:center;
      font-size:12px; opacity:.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>☕ OneSpark 星火</h1>
    <p>星火任務中心：下載與資料管理</p>

    <p style="margin:10px 0 4px; font-weight:bold;">📥 直接下載宗譜電子版</p>
    <a class="download-btn" href="https://johnyuh.github.io/onespark-app/files/泉田喻氏宗譜_2025整合本_橫式版.pdf" download>下載 橫式版 PDF</a><br>
    <a class="download-btn" href="https://johnyuh.github.io/onespark-app/files/泉田喻氏宗譜_派代表樹狀圖_2025新版.pdf" download>下載 樹狀圖 PDF</a><br>
    <a class="download-btn" href="https://johnyuh.github.io/onespark-app/files/泉田喻氏宗譜_2025整合本_橫式版.docx" download>下載 橫式版 Word</a>

    <div class="progress" id="progress">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="complete" id="complete">✅ 下載完成</div>
  </div>

  <footer>可用「分享 → 加到主畫面」安裝 App</footer>

  <script>
  // 註冊 PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  }

  const progress = document.getElementById('progress');
  const progressBar = document.getElementById('progress-bar');
  const complete = document.getElementById('complete');

  document.querySelectorAll('a.download-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      const url = btn.href;
      const fileName = decodeURIComponent(url.split('/').pop());

      progress.style.display = 'block';
      progressBar.style.width = '0%';
      complete.style.display = 'none';
      complete.style.opacity = 0;

      try {
        // 模擬進度
        let width = 0;
        const timer = setInterval(() => {
          width += 15;
          progressBar.style.width = width + '%';
          if (width >= 90) clearInterval(timer);
        }, 150);

        const res = await fetch(url);
        const blob = await res.blob();
        clearInterval(timer);
        progressBar.style.width = '100%';

        const file = new File([blob], fileName);
        const blobUrl = URL.createObjectURL(blob);

        // ✅ iOS Safari / PWA 模式
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: fileName,
            text: '下載 OneSpark 星火 檔案',
            files: [file]
          });
        } else {
          // ✅ 備援（桌機／其他瀏覽器）
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }

        setTimeout(() => {
          progress.style.display = 'none';
          complete.style.display = 'block';
          complete.style.opacity = 1;
          setTimeout(() => { complete.style.opacity = 0; }, 1500);
        }, 600);

      } catch (err) {
        alert('下載失敗，請稍後重試');
        progress.style.display = 'none';
      }
    });
  });
  </script>
</body>
</html>
