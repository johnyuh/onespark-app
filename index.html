<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>泉田喻氏宗譜 數位化下載</title>
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: "DFKai-SB", "Noto Sans TC", sans-serif;
      background-color: #f8f9fa;
      color: #222;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 1.2rem;
    }
    h1 { margin: 0.3em 0; }
    main {
      max-width: 700px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }
    a.download-btn {
      display: block;
      margin: 1em auto;
      padding: 1em;
      width: 90%;
      max-width: 360px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, #007bff, #00bfff);
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      transition: all 0.2s;
    }
    a.download-btn:hover { transform: scale(1.04); }
    #progress {
      width: 80%;
      max-width: 420px;
      height: 10px;
      background: #ddd;
      margin: 1.4em auto;
      border-radius: 5px;
      display: none;
      overflow: hidden;
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: #28a745;
      transition: width 0.1s linear;
    }
    footer {
      margin-top: 2rem;
      color: #666;
      font-size: 0.9rem;
    }
    /* 浮動按鈕 */
    #donate-btn, #mail-btn {
      position: fixed;
      bottom: 20px;
      width: 56px; height: 56px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: transform .2s;
      z-index: 999;
    }
    #donate-btn { left: 20px; background: linear-gradient(90deg,#ff758c,#ff7eb3); }
    #mail-btn { right: 20px; background: linear-gradient(90deg,#007bff,#00bfff); }
    #donate-btn:hover, #mail-btn:hover { transform: scale(1.08); }
    /* 郵件表單 */
    #mail-form {
      position: fixed;
      bottom: 86px;
      right: 20px;
      width: 320px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(0,0,0,.25);
      border-radius: 12px;
      padding: 12px;
      display: none;
      flex-direction: column;
      z-index: 1000;
      animation: fadeIn .25s;
    }
    #mail-form h3 { margin: 0 0 8px; font-size: 16px; }
    #mail-form input, #mail-form textarea {
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
    }
    #mail-form .actions {
      display: flex; gap: 8px; margin-top: 8px;
    }
    #mail-form button {
      flex: 1;
      background: #007bff;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    #mail-cancel { background: #6c757d; }
    @keyframes fadeIn { from {opacity:0; transform:translateY(8px);} to {opacity:1; transform:translateY(0);} }
    /* 通知 */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.85);
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: .95rem;
      opacity: 0; pointer-events: none;
      transition: opacity .35s;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>泉田喻氏宗譜 數位化檔案</h1>
    <p>2025 整合版</p>
  </header>

  <main>
    <h2>📘 族譜電子版下載</h2>
    <p style="margin:10px 0 6px; font-weight:bold;">📥 直接下載宗譜電子版</p>

    <a class="download-btn" href="https://johnyuh.github.io/onespark-app/files/泉田喻氏宗譜_2026整合本_橫式版.pdf" download="泉田喻氏宗譜_2026整合本_橫式版.pdf" rel="noopener">下載 橫式版 PDF</a>
    <a class="download-btn" href="https://johnyuh.github.io/onespark-app/files/泉田喻氏宗譜_2026整合本_直式版.pdf" download="泉田喻氏宗譜_2026整合本_直式版.pdf" rel="noopener">下載 橫式版 PDF</a>
    <a class="download-btn" href="https://johnyuh.github.io/onespark-app/files/泉田喻氏宗譜_2026整合本_派代表樹狀圖.pdf" download="泉田喻氏宗譜_2026整合本_派代表樹狀圖.pdf" rel="noopener">下載 樹狀圖 PDF</a>
   
    <div id="progress"><div id="progress-bar"></div></div>
  </main>

  <footer>
    <p>製作：星火數位工作室 (OneSpark Digital Studio) ｜ 更新日期：2026/03/08</p>
  </footer>

  //<button id="donate-btn" onclick="window.location.href='donate.html'">💖</button>
  <button id="mail-btn" title="留言信箱">📧</button>

  <div id="mail-form">
    <h3>📬 留言給 OneSpark 星火</h3>
    <input id="sender-name" placeholder="您的姓名">
    <input id="sender-email" placeholder="您的 Email（選填）">
    <textarea id="sender-message" rows="4" placeholder="留言內容"></textarea>
    <div class="actions">
      <button id="mail-cancel" type="button">取消</button>
      <button id="send-mail" type="button">送出留言</button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
  // PWA：若有 service-worker.js 會自動註冊
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  }

  // 提示訊息（保留可用於其他通知）
  function showToast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
  }

  // ✅ 修正：移除原本攔截下載的事件（讓 <a download> 原生下載生效）
  document.querySelectorAll('a.download-btn').forEach(btn => {
    const clone = btn.cloneNode(true); // 透過克隆移除所有事件監聽
    btn.replaceWith(clone);
  });

  // 🧭 Safari 專用下載修正：部分 Safari 會忽略 <a download> 或改為預覽 PDF
  (function(){
    var ua = navigator.userAgent;
    var isSafari = /^((?!chrome|android).)*safari/i.test(ua);
    if (!isSafari) return; // 只有 Safari 啟用修正

    document.querySelectorAll('a.download-btn').forEach(function(a){
      a.addEventListener('click', async function(e){
        try {
          e.preventDefault();
          const res = await fetch(a.href, { credentials: 'omit' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const blob = await res.blob();
          const blobUrl = URL.createObjectURL(blob);
          const fileName = decodeURIComponent(a.getAttribute('download') || a.href.split('/').pop());
          const tmp = document.createElement('a');
          tmp.href = blobUrl;
          tmp.download = fileName;
          document.body.appendChild(tmp);
          tmp.click();
          tmp.remove();
          setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 60000);
        } catch (err) {
          alert('下載失敗：' + err.message);
        }
      });
    });
  })();


  // 留言窗開關
  const mailBtn = document.getElementById('mail-btn');
  const mailForm = document.getElementById('mail-form');
  const cancelBtn = document.getElementById('mail-cancel');
  mailBtn.addEventListener('click', () => {
    mailForm.style.display = (mailForm.style.display === 'flex') ? 'none' : 'flex';
  });
  cancelBtn.addEventListener('click', () => { mailForm.style.display = 'none'; });
  </script>

  <script src="email.js"></script>
</body>
</html>
