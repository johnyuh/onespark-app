<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneSpark 星火 App</title>
  <style>
    body {
      font-family: system-ui, "PingFang TC", sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #1a1a1a, #2d2d2d);
      color: #f5f5f5;
      text-align: center;
    }

    header {
      padding: 50px 20px 20px;
    }

    h1 {
      color: #ff8c42;
      font-size: 2.2em;
      margin-bottom: 0.2em;
    }

    p.subtitle {
      color: #bbb;
      font-size: 1.1em;
      margin-top: 0;
    }

    section {
      margin: 40px auto;
      max-width: 400px;
      background-color: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 30px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    button {
      background-color: #ff8c42;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      margin: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #e6762d;
    }

    footer {
      font-size: 0.9em;
      color: #777;
      margin-top: 60px;
      padding-bottom: 30px;
    }
  </style>
</head>
<body>

  <header>
    <h1>☕ OneSpark 星火</h1>
    <p class="subtitle">智慧啟動，創造星火瞬間</p>
  </header>

  <section>
    <h2>📥 下載宗譜電子版</h2>
    <p>選擇檔案類型以下載：</p>

    <button onclick="downloadFile('https://johnyuh.github.io/onespark-app/files/泉田喻氏宗譜_2025整合本_橫式版.pdf')">
      下載 PDF 檔
    </button>

    <button onclick="downloadFile('https://johnyuh.github.io/onespark-app/files/泉田喻氏宗譜_2025整合本_橫式版.docx')">
      下載 Word 檔
    </button>
  </section>

  <footer>
    © 2025 OneSpark 星火 ｜ All Rights Reserved
  </footer>

  <script>
    function downloadFile(url) {
      const a = document.createElement('a');
      a.href = url;
      a.download = ''; // 讓瀏覽器自動決定檔名
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      alert('☕ 檔案下載中，請稍候完成後查看下載資料夾。');
    }
  </script>

</body>
</html>
